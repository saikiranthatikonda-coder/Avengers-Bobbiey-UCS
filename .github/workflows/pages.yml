# Publishes the public website (docs/) to GitHub Pages on every push to main
# that touches it. Deploys to the gh-pages branch; each deploy is stamped with
# the source commit so the live site is traceable to the repo.
name: Publish website

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard website claims
        run: python3 -m unittest tests.test_site -v

      - name: Stamp build
        run: |
          STAMP="${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          sed -i "s|__BUILD__|${STAMP}|" docs/index.html

      - name: Push docs/ to gh-pages
        run: |
          cd docs
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
